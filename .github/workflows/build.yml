name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up NDK r25c
        uses: nttld/setup-ndk@v1
        with: { ndk-version: r25c }

      - name: Unzip Source
        run: |
          unzip -q x1dead-src.zip
          # Покажем, что вообще лежит в корне после распаковки
          ls -la

      - name: Build native library
        run: |
          # Ищем файл Android.mk и заходим в его папку
          MK_PATH=$(find . -name "Android.mk" | head -n 1)
          
          if [ -z "$MK_PATH" ]; then
            echo "Android.mk not found!"
            exit 1
          fi
          
          MK_DIR=$(dirname "$MK_PATH")
          echo "Found Android.mk in: $MK_DIR"
          
          # Заходим в папку с Android.mk (это может быть jni или корень)
          cd "$MK_DIR"
          
          if [ -f "jni/Android.mk" ]; then
             $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./jni/Android.mk NDK_APPLICATION_MK=./jni/Application.mk
          else
             $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk
          fi

      - name: Upload Artifact
        run: |
          # Ищем скомпилированный .so файл
          find . -name "*.so" -path "*arm64*"

      - uses: actions/upload-artifact@v4
        with:
          name: libx1dead_final
          path: "**/*.so"
