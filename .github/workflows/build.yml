name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up NDK r25c
        uses: nttld/setup-ndk@v1
        with: { ndk-version: r25c }

      - name: Unzip Source
        run: |
          unzip -q litvin.zip
          
      - name: Build with CMake
        run: |
          # Заходим в папку с исходниками (она может называться litvin или быть в корне)
          if [ -d "litvin" ]; then cd litvin; fi
          
          cmake -B build -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24
          cmake --build build -j

      - name: Upload Artifact
        run: |
          find . -name "*.so" -path "*build*"

      - uses: actions/upload-artifact@v4
        with:
          name: libx1dead_final
          path: "**/libLitvinTap.so"
