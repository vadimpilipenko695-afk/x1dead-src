name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up NDK r25c
        uses: nttld/setup-ndk@v1
        with: { ndk-version: r25c }

      - name: Unzip Source
        run: |
          unzip -q x1dead-src.zip

      - name: Patch Android.mk
        run: |
          # Заходим в jni и меняем путь с inj на src в Android.mk
          cd ./x1dead-src/jni
          
          # Удаляем старые пути и заменяем на src
          sed -i 's|../inj/main.cpp|../src/main.cpp|g' Android.mk
          # Если есть другие файлы из inj, тоже меняем
          sed -i 's|../inj/|../src/|g' Android.mk

      - name: Build native library
        run: |
          cd ./x1dead-src/jni
          # Запускаем сборку
          $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk

      - name: Upload Artifact
        run: |
          find . -name "*.so" -path "*arm64*"

      - uses: actions/upload-artifact@v4
        with:
          name: libx1dead_final
          path: "./x1dead-src/libs/arm64-v8a/*.so"
